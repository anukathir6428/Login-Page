<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Modern Full Stack Authentication App with Node.js, Express, Database, and Netlify Deployment">
  <title>GlowLogic Solution - Login & Registration Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Dynamic Glowing Background Orbs -->
  <div class="bg-glow-orb orb-1"></div>
  <div class="bg-glow-orb orb-2"></div>
  <div class="bg-glow-orb orb-3"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <main class="app-container">
    
    <!-- Brand Header -->
    <header class="auth-header">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>GlowLogic Solution</span>
      </div>
      <h1 id="headerTitle">Welcome Back</h1>
      <p id="headerSubtitle">Please log in to access your dashboard account</p>
    </header>

    <!-- Tab Switcher -->
    <div class="tab-switcher">
      <button type="button" class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button type="button" class="tab-btn" id="tabRegister" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Forms Wrapper -->
    <div class="form-wrapper">

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
        
        <div class="input-group">
          <label for="loginInput">Email or Username</label>
          <div class="input-control">
            <input type="text" id="loginInput" placeholder="name@example.com or john_doe" required autocomplete="username">
            <svg class="input-icon" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>

        <div class="input-group">
          <label for="loginPassword">Password</label>
          <div class="input-control">
            <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
            <svg class="input-icon" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('loginPassword', this)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="loginSubmitBtn">
          <span class="btn-text">Sign In</span>
          <div class="spinner" id="loginSpinner"></div>
        </button>

      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
        
        <div class="input-group">
          <label for="regName">Full Name</label>
          <div class="input-control">
            <input type="text" id="regName" placeholder="Anu Kumar" required>
            <svg class="input-icon" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>

        <div class="input-group">
          <label for="regUsername">Username</label>
          <div class="input-control">
            <input type="text" id="regUsername" placeholder="anukumar" required>
            <svg class="input-icon" viewBox="0 0 24 24">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <polyline points="17 11 19 13 23 9"></polyline>
            </svg>
          </div>
        </div>

        <div class="input-group">
          <label for="regEmail">Email Address</label>
          <div class="input-control">
            <input type="email" id="regEmail" placeholder="anu@example.com" required>
            <svg class="input-icon" viewBox="0 0 24 24">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
        </div>

        <div class="input-group">
          <label for="regPassword">
            Password
            <span id="strengthText" class="strength-text"></span>
          </label>
          <div class="input-control">
            <input type="password" id="regPassword" placeholder="Minimum 6 characters" required oninput="checkPasswordStrength(this.value)">
            <svg class="input-icon" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('regPassword', this)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="strength-meter">
            <div id="strengthBar" class="strength-bar"></div>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="registerSubmitBtn">
          <span class="btn-text">Create Account</span>
          <div class="spinner" id="registerSpinner"></div>
        </button>

      </form>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
